[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "cross-document-graph-rag-synthesizer"
version = "0.1.0"
description = "Constructs semantic entity-relationship knowledge graphs across multi-file documents for multi-hop RAG queries"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [
    {name = "Ejaj Mahmud", email = "dev@ejajmahmud.com"}
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
]
dependencies = []

[project.scripts]
cross-document-graph-rag-synthesizer = "cross_document_graph_rag_synthesizer.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["cross_document_graph_rag_synthesizer*"]
